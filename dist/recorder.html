<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gratify Screen & Webcam Recorder</title>
  <!-- Google Fonts Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Premium Glassmorphic Layout Styles */
    :root {
      --bg-main: #0c0c10;
      --bg-gradient: linear-gradient(135deg, #09090d 0%, #121220 100%);
      --card-bg: rgba(22, 22, 34, 0.6);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.45);
      
      --primary: hsl(265, 85%, 62%);
      --primary-hover: hsl(265, 90%, 67%);
      --secondary: rgba(255, 255, 255, 0.05);
      --secondary-hover: rgba(255, 255, 255, 0.1);
      
      --accent-cyan: #00f0ff;
      --accent-red: #ef4444;
      --text-primary: #f3f3f7;
      --text-muted: #888899;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-main);
      background-image: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding: 40px;
    }

    /* Ambient glows */
    body::before {
      content: '';
      position: absolute;
      top: -10%;
      left: 20%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(138, 43, 226, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      pointer-events: none;
    }

    .app-container {
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 30px;
      position: relative;
      z-index: 2;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo-area { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--primary) 100%);
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(138, 43, 226, 0.4);
    }
    .logo-text { font-size: 22px; font-weight: 700; }
    .accent-text {
      background: linear-gradient(90deg, var(--accent-cyan), var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      background: rgba(138, 43, 226, 0.15);
      border: 1px solid rgba(138, 43, 226, 0.35);
      color: #c9a0ff;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    main {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 30px;
    }

    /* Left Video Panel */
    .preview-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      aspect-ratio: 16/10;
      position: relative;
      background-color: #050508;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      flex: 1;
    }

    .preview-placeholder {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      gap: 16px;
      font-size: 16px;
    }

    .placeholder-icon {
      font-size: 48px;
      opacity: 0.8;
      animation: pulse 2s infinite;
    }

    /* Right Control Panel */
    .controls-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      border-radius: 16px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      backdrop-filter: blur(10px);
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 8px;
    }

    .timer-display {
      font-size: 48px;
      font-weight: 700;
      text-align: center;
      font-family: monospace;
      color: var(--text-primary);
      margin: 10px 0;
      letter-spacing: 2px;
    }

    .timer-recording {
      color: var(--accent-red);
      animation: blink 1.5s infinite;
    }

    .btn {
      width: 100%;
      padding: 16px 24px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-stop {
      background: var(--accent-red);
      color: #fff;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
    }

    .btn-stop:hover {
      background: #dc2626;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--secondary);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-primary);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--secondary-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-block {
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
      font-size: 14px;
    }

    .status-lbl { color: var(--text-muted); margin-bottom: 2px; font-size: 11px; text-transform: uppercase; }
    .status-val { font-weight: 600; color: var(--accent-cyan); }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    select {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px;
      border-radius: 6px;
      color: var(--text-primary);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    select:focus {
      outline: none;
      border-color: var(--primary);
    }

    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
      100% { opacity: 0.5; transform: scale(1); }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <div class="logo-area">
        <div class="logo-icon"></div>
        <span class="logo-text">Gratify<span class="accent-text">.ai</span></span>
      </div>
      <div class="badge">Screen Studio</div>
    </header>

    <main>
      <!-- Video Preview Frame -->
      <div class="preview-card">
        <video id="preview-video" autoplay muted></video>
        <div id="preview-placeholder" class="preview-placeholder">
          <div class="placeholder-icon">🎥</div>
          <p id="placeholder-text">Camera stream is active.</p>
        </div>
      </div>

      <!-- Control Center -->
      <div class="controls-card">
        <h4 class="section-title">Recorder Dashboard</h4>
        
        <div class="status-block">
          <div class="status-lbl">Recorder Status</div>
          <div id="status-val" class="status-val">Ready</div>
        </div>

        <div id="timer-display" class="timer-display">00:00:00</div>

        <!-- Mode Configuration -->
        <div class="input-group">
          <label for="capture-source">Capture Type</label>
          <select id="capture-source">
            <option value="screen">💻 Screen Share + Mic</option>
            <option value="camera">📷 Webcam + Mic</option>
          </select>
        </div>

        <!-- Action triggers -->
        <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
          <button id="btn-start" class="btn btn-primary">
            <span>🔴 Start Recording</span>
          </button>
          
          <button id="btn-stop" class="btn btn-stop" style="display: none;">
            <span>⏹ Stop Capture</span>
          </button>

          <button id="btn-download" class="btn btn-primary" style="display: none; background: linear-gradient(135deg, #00f0ff 0%, #8a2be2 100%)">
            <span>📥 Download Recording</span>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="recorder.js"></script>
</body>
</html>
